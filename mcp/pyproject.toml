[project]
name = "fystash-mcp"
version = "0.1.1"
description = "Stdio MCP server for Fystash: room/sandbox/fabric/drive tools over public control-plane REST"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fystash" }]
keywords = ["fystash", "mcp", "sandbox", "firecracker", "multi-agent"]
dependencies = [
  "mcp>=1.0.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://fystash.ai"
Documentation = "https://docs.fystash.ai/mcp/install"
Repository = "https://github.com/fystash/sdk"
Issues = "https://github.com/fystash/sdk/issues"

[project.scripts]
fystash-mcp = "fystash_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fystash_mcp"]
