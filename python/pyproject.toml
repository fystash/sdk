[project]
name = "fystash-sdk"
version = "0.1.0"
description = "Async Python SDK for the Fystash fabric protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fystash" }]
dependencies = [
  "protobuf>=7.35,<8",
]

[project.urls]
Homepage = "https://fystash.ai"
Documentation = "https://docs.fystash.ai/sdk/python"
Repository = "https://github.com/fystash/sdk"
Issues = "https://github.com/fystash/sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fystash"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "grpcio-tools",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "types-protobuf",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"src/fystash/_generated/*" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/fystash/_generated/"]
